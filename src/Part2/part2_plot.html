<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Part 2, visual exploration</title>
<style>
  :root {
    --tab-bg: #f4f4f4;
    --tab-bg-active: #ffffff;
    --tab-border: #d0d0d0;
    --tab-text: #555;
    --tab-text-active: #111;
    --accent: #2166ac;
  }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #fff;
  }
  .tabs {
    display: flex;
    border-bottom: 1px solid var(--tab-border);
    background: var(--tab-bg);
    padding: 0 8px;
  }
  .tab-btn {
    flex: 0 0 auto;
    padding: 10px 18px;
    border: 1px solid transparent;
    border-bottom: none;
    background: transparent;
    color: var(--tab-text);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    margin-right: 4px;
    border-top-left-radius: 6px;
    border-top-right-radius: 6px;
    transition: background 0.15s, color 0.15s;
  }
  .tab-btn:hover { background: #eaeaea; }
  .tab-btn.active {
    background: var(--tab-bg-active);
    border-color: var(--tab-border);
    color: var(--tab-text-active);
    position: relative;
    top: 1px;
    border-bottom: 2px solid var(--accent);
  }
  .panel-wrap {
    width: 100%;
    height: calc(100% - 44px);
    position: relative;
  }
  .panel {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    border: 0;
    display: none;
  }
  .panel.active { display: block; }
</style>
</head>
<body>
  <div class="tabs" role="tablist">
    <button class="tab-btn active" data-target="tab-scatter" role="tab" aria-selected="true">Units vs population (scatter)</button>
    <button class="tab-btn" data-target="tab-income" role="tab" aria-selected="false">Income change (map)</button>
    <button class="tab-btn" data-target="tab-population" role="tab" aria-selected="false">Population change (map)</button>
  </div>
  <div class="panel-wrap">
    <iframe id="tab-scatter"    class="panel active" src="scatter_units_vs_population.html" title="Units vs population scatter" loading="lazy"></iframe>
    <iframe id="tab-income"     class="panel"        src="map_income_plotly.html"           title="Average income change map" loading="lazy"></iframe>
    <iframe id="tab-population" class="panel"        src="map_population_folium.html"       title="Population change map"     loading="lazy"></iframe>
  </div>

<script>
  const buttons = document.querySelectorAll('.tab-btn');
  const panels  = document.querySelectorAll('.panel');

  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      buttons.forEach(b => {
        b.classList.remove('active');
        b.setAttribute('aria-selected', 'false');
      });
      panels.forEach(p => p.classList.remove('active'));

      btn.classList.add('active');
      btn.setAttribute('aria-selected', 'true');
      document.getElementById(btn.dataset.target).classList.add('active');
    });
  });
</script>
</body>
</html>
